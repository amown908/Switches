<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Boeing 777 Flight Deck</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #1a1412; 
            color: #e2e8f0; 
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #ffffff; margin-bottom: 5px; }
        .subtitle { color: #bcaaa4; margin-bottom: 25px; text-align: center; }

        .cockpit-container { 
            position: relative; 
            display: inline-block; 
            max-width: 600px; 
            width: 100%;
            margin: 0 auto;
            border: 4px solid #3e2723; border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.9);
        }
        img { max-width: 100%; height: auto; display: block; }

        .panel-box {
            position: absolute;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            text-decoration: none;
        }
        .panel-box:hover {
            background: rgba(245, 158, 11, 0.2); 
            border-color: #f59e0b;
        }

        /* Hover Tooltip */
        .panel-box::after {
            content: attr(title);
            position: absolute;
            bottom: 8px; left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 20, 18, 0.95);
            color: #f59e0b;
            font-size: 0.75em; font-weight: 600;
            padding: 6px 10px; border-radius: 4px;
            white-space: nowrap; opacity: 0;
            transition: opacity 0.15s; pointer-events: none;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
            border: 1px solid #4e342e;
        }
        .panel-box:hover::after { opacity: 1; }

        /* Mapped Coordinates */
        #overhead         { top: 0%;    left: 0%;    width: 100%; height: 32%; }
        #compass          { top: 32%;   left: 46%;   width: 8%;   height: 4%;  }
        #glareshield      { top: 42%;   left: 15%;   width: 70%;  height: 23.5%; }
        #pedestal         { top: 58%;   left: 29%;   width: 42%;  height: 42%; }
        #lateral-capt     { top: 48%;   left: 0%;    width: 20%;  height: 25%; }
        #lateral-fo       { top: 48%;   left: 80%;   width: 20%;  height: 25%; }
    </style>
</head>
<body>

    <h1>Boeing 777 Flight Deck Guide</h1>
    <p class="subtitle">Hover over a layout section to preview. Click a panel to view its switches.</p>

    <div class="cockpit-container">
        <img src="b777_cockpit.jpeg" alt="Boeing 777 Flight Deck System Breakdown">

        <a href="oswitchsss.html"   class="panel-box" id="overhead"     title="Overhead Panel System"></a>
        <a href="gswitchesss.html"  class="panel-box" id="glareshield"  title="Glareshield &amp; Main Panel"></a>
        <a href="pswitchesss.html"  class="panel-box" id="pedestal"     title="Pedestal"></a>
        <a href="gswitches.html"    class="panel-box" id="lateral-capt" title="Lateral Console — Capt"></a>
        <a href="gswitches.html"    class="panel-box" id="lateral-fo"   title="Lateral Console - FO"></a>
    </div>

</body>
</html>
